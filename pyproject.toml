[project]
name = "forge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "pillow>=12.2.0",
    "pre-commit>=4.6.0",
    "psycopg[binary]>=3.3.4",
    "redis>=8.0.0",
    "requests>=2.34.2",
    "rq>=2.9.1",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.16",
]

[tool.ruff]
  line-length = 88
  target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
